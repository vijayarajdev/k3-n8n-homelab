fullnameOverride: postgres-dev

type: postgresql
mode: standalone

version:
  postgresql: "18"

cluster:
  instances: 1
  enablePDB: false
  enableSuperuserAccess: false

  # standard flavor includes pgvector
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie

  storage:
    size: 30Gi
    storageClass: ""
  walStorage:
    enabled: false

  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { cpu: "1", memory: 1Gi }

  initdb:
    database: n8n
    owner: n8n
    secret:
      name: n8n-pg-dev-app
    postInitApplicationSQL:
      - CREATE EXTENSION IF NOT EXISTS vector;